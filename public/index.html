<!-- MACHADOEXPRESS HOME REDESIGN V4 -->
<style id="machado-home-redesign-v4">
:root {
  --mx-bg: #070a10;
  --mx-panel: #0e1520;
  --mx-panel2: #121c2a;
  --mx-line: #263344;
  --mx-cyan: #08c8e8;
  --mx-blue: #078bd0;
  --mx-purple: #8b35ff;
  --mx-text: #f5f8ff;
  --mx-muted: #93a4ba;
}

/* Base */
html {
  scroll-behavior: smooth;
}
body {
  background-color: var(--mx-bg);
  color: var(--mx-text);
}
body img {
  max-width: 100%;
}
body main {
  box-sizing: border-box;
  width: 100%;
  max-width: 1440px;
  margin-inline: auto;
}
body main > *,
body #app > *,
body .app > * {
  min-width: 0;
}
body h1,
body h2,
body h3 {
  color: var(--mx-text);
  line-height: 1.2;
  letter-spacing: -.025em;
}
body p {
  line-height: 1.55;
}

/* Cabeçalho: compacto, sem esconder controles */
header {
  position: relative;
  z-index: 20;
}
header .nav-tools,
.nav-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}
header a,
header button,
.nav-tools a,
.nav-tools button {
  -webkit-tap-highlight-color: transparent;
}
header img,
.nav-tools img {
  object-fit: contain;
}
header .logo img,
header .brand img,
header .site-logo img {
  max-width: 100%;
  height: auto;
}

/* Conteúdo principal e banners */
main section,
#app section,
.page-content section {
  min-width: 0;
}
main img,
#app img,
.page-content img {
  height: auto;
}
main > img,
main .banner img,
main .hero img,
#app .banner img,
#app .hero img {
  display: block;
  max-width: 100%;
}
main .hero,
main .home-hero,
main .banner,
main .hero-banner,
#app .hero,
#app .home-hero,
#app .banner,
#app .hero-banner {
  overflow: hidden;
  border-radius: 18px;
}
main .hero img,
main .home-hero img,
main .banner img,
main .hero-banner img,
#app .hero img,
#app .home-hero img,
#app .banner img,
#app .hero-banner img {
  width: 100%;
  object-fit: cover;
}

/* Cartões de produtos */
.product-card,
.product-item,
.produto-card,
.product,
.product-box,
.product-tile,
[data-product-id],
.products-grid > *,
.product-grid > *,
#products > *,
#product-list > *,
.products > * {
  box-sizing: border-box;
  min-width: 0;
  overflow: hidden;
  background: linear-gradient(160deg, #111a27 0%, #0a1019 100%);
  border: 1px solid var(--mx-line);
  border-radius: 20px;
  box-shadow: 0 7px 22px rgba(0,0,0,.18);
  transition: border-color .18s ease, transform .18s ease,
              box-shadow .18s ease;
}
.product-card:hover,
.product-item:hover,
.produto-card:hover,
.product:hover,
.product-box:hover,
.product-tile:hover {
  border-color: rgba(8,200,232,.55);
  box-shadow: 0 10px 28px rgba(0,160,220,.09);
}

/* Fotos padronizadas sem deformar a imagem */
.product-card img,
.product-item img,
.produto-card img,
.product-box img,
.product-tile img,
[data-product-id] img {
  max-width: 100%;
}
.product-card .product-image,
.product-item .product-image,
.produto-card .product-image,
.product-card .image-container,
.product-item .image-container,
.product-card .product-img,
.product-item .product-img {
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #fff;
}
.product-card .product-image img,
.product-item .product-image img,
.produto-card .product-image img,
.product-card .image-container img,
.product-item .image-container img,
.product-card .product-img img,
.product-item .product-img img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.product-card h3,
.product-item h3,
.produto-card h3,
.product-box h3,
.product-tile h3 {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  overflow-wrap: anywhere;
  line-height: 1.35;
}
.product-card .price,
.product-item .price,
.produto-card .price,
.product-box .price,
.product-tile .price {
  color: #fff;
  font-size: clamp(1.15rem, 3.5vw, 1.55rem);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

/* Botões */
body button,
body .btn,
body input[type="submit"],
body a.button {
  -webkit-tap-highlight-color: transparent;
}
.product-card button,
.product-item button,
.produto-card button,
.product-box button,
.product-tile button,
button.add-to-cart,
button.add-cart,
.add-to-cart {
  min-height: 46px;
  border-radius: 13px;
  font-weight: 750;
}
body button:focus-visible,
body a:focus-visible,
body input:focus-visible,
body select:focus-visible {
  outline: 2px solid var(--mx-cyan);
  outline-offset: 3px;
}

/* Categorias */
.category-card,
.category-item,
.category-tile,
.categories a,
.category-chip {
  border-radius: 15px;
  transition: border-color .18s ease, background .18s ease;
}
.categories a,
.category-chip {
  border: 1px solid #26394d;
  background: #101b29;
}

/* Benefícios e atalhos */
.feature-card,
.benefit-card,
.benefits > *,
.trust-card,
.service-card {
  box-sizing: border-box;
  min-width: 0;
  border: 1px solid #252e3b;
  border-radius: 17px;
  background: linear-gradient(145deg, #111720, #0c1119);
}
.feature-card p,
.benefit-card p,
.trust-card p,
.service-card p {
  overflow-wrap: anywhere;
}

/* Campos de pesquisa e formulários */
body input,
body select,
body textarea {
  box-sizing: border-box;
  max-width: 100%;
  border-radius: 12px;
}
body input:not([type="checkbox"]):not([type="radio"]),
body select,
body textarea {
  min-height: 42px;
}

/* WhatsApp flutuante: impedir que cubra elementos essenciais */
.whatsapp-float,
.whatsapp-button,
#whatsapp-float,
a[href*="wa.me"].floating,
a[href*="api.whatsapp.com"].floating {
  z-index: 30;
}

/* Rodapé */
footer {
  min-width: 0;
  overflow: hidden;
}
footer img {
  max-width: 100%;
  height: auto;
}
footer a {
  overflow-wrap: anywhere;
}

/* Celular */
@media (max-width: 700px) {
  body main {
    padding-bottom: 22px;
  }

  main .hero,
  main .home-hero,
  main .banner,
  main .hero-banner,
  #app .hero,
  #app .home-hero,
  #app .banner,
  #app .hero-banner {
    border-radius: 13px;
  }

  .product-card,
  .product-item,
  .produto-card,
  .product,
  .product-box,
  .product-tile,
  [data-product-id] {
    border-radius: 16px;
  }

  .product-card h3,
  .product-item h3,
  .produto-card h3,
  .product-box h3,
  .product-tile h3 {
    font-size: 14px;
  }

  .product-card button,
  .product-item button,
  .produto-card button,
  .product-box button,
  .product-tile button,
  button.add-to-cart,
  button.add-cart,
  .add-to-cart {
    width: 100%;
    min-height: 44px;
    padding: 10px 8px;
  }

  footer {
    overflow-wrap: anywhere;
  }
}

/* Acessibilidade */
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
<!-- /MACHADOEXPRESS HOME REDESIGN V4 -->

@media (min-width: 701px) {

</style>
